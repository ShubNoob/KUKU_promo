# ---------------------------------------------------------------------------
# Promo Extractor config. To swap models, change ONLY this block.
# ---------------------------------------------------------------------------
llm:
  provider: gemini            # gemini | openai_compatible | mock
  model: gemini-flash-latest  # any Gemini model ID your key can use (see notebook cell "list models")
  temperature: 0.2
  # Free tier: keep requests/minute below your project's quota (check Google AI Studio).
  requests_per_minute: 8
  max_retries: 5
  # Only used when provider: openai_compatible (Groq, OpenRouter, OpenAI, Ollama, ...)
  base_url: null              # e.g. https://api.groq.com/openai/v1  or  http://localhost:11434/v1
  api_key_env: GEMINI_API_KEY # name of the environment variable that holds the key

# ---------------------------------------------------------------------------
# Promo rules (from the Kuku brief). Python enforces these, not the model.
# ---------------------------------------------------------------------------
promo:
  min_seconds: 20
  max_seconds: 60
  hooks_per_episode: 5        # Hook Hunter asks for 3-5; this is the upper limit
  hook_must_land_within: 3.0  # seconds: the hook must happen in the first 3s of the clip
  snap_tolerance: 1.0         # a model timestamp must be within 1s of a real event, else rejected

# Tier rules (Phase 5 sorter)
tiers:
  tier1_min_hook: 7           # hook_intensity_score >= this
  tier1_min_cliffhanger: 7    # cliffhanger_intensity_score >= this
  splice_max_middle: 4        # middle_story_engagement_score <= this -> Tier 2 (editor splice)
  top_n_for_ranker: 40        # only the best N clips (by score) go to the LLM ranker
  hand_check_sample: 15       # random clips put in hand_check.csv for blind human labelling

cache_dir: .cache             # every model response is saved here; reruns cost nothing
